services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: irbis_mart
      POSTGRES_USER: irbis
      POSTGRES_PASSWORD: irbis_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irbis -d irbis_mart"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://irbis:irbis_dev_password@db:5432/irbis_mart
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-please-32-chars-min}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_DELIVERY_ENABLED: "true"
      DEMO_PAYMENTS: "true"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
