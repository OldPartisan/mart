<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#99B415" />
    <title>Ирбис Март</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #99B415; color: #1a1a1a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center; padding: 24px;
      }
      .card { width: 100%; max-width: 360px; background: #fff; border-radius: 24px; padding: 32px 24px; box-shadow: 0 24px 64px -28px rgba(0,0,0,.35); }
      img { width: 190px; height: auto; margin: 0 auto 20px; display: block; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { font-size: 14px; color: #5f666b; line-height: 1.5; margin: 0 0 20px; }
      button { width: 100%; height: 48px; border: 0; border-radius: 12px; background: #99B415; color: #fff; font-size: 15px; font-weight: 600; }
      .hint { margin-top: 14px; font-size: 11px; color: #8a9298; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="logo.png" alt="Ирбис Март" />
      <h1>Нет подключения</h1>
      <p>Проверьте интернет — каталог и заказы загрузятся снова.</p>
      <button onclick="location.href='https://irbis-mart.vercel.app'">Повторить</button>
      <div class="hint">Ирбис Март · фермерский супермаркет</div>
    </div>
  </body>
</html>
