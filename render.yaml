services:
  - type: web
    name: irbis-mart
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_DELIVERY_ENABLED
        value: "true"
      - key: DEMO_PAYMENTS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_MANAGER_PASSWORD
        sync: false
      - key: SEED_CLIENT_PASSWORD
        sync: false
